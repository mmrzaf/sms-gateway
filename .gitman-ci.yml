image: docker:29-cli

docker: true

env:
  DOCKER_BUILDKIT: "1"

  GO_IMAGE: golang:1.26-bookworm
  RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot

  DEBIAN_MIRROR: http://linux-mirror.liara.ir/repository/debian
  DEBIAN_SECURITY_MIRROR: http://linux-mirror.liara.ir/repository/debian-security
  GOPROXY: https://mirror.abrha.net/repository/go/,direct

  IMAGE_NAME: sms-gateway
  DEPLOY_DIR: /srv/apps/sms-gateway

steps:
  - name: verify docker access
    run: |
      set -eu
      docker version

  - name: verify local base images
    run: |
      set -eu
      docker image inspect "$GO_IMAGE" >/dev/null
      docker image inspect "$RUNTIME_IMAGE" >/dev/null

  - name: resolve version
    run: |
      set -eu
      : "${GITMAN_COMMIT:?GITMAN_COMMIT is required}"

      RAW_IMAGE_TAG="${GITMAN_TAG:-}"

      if [ -n "$RAW_IMAGE_TAG" ]; then
        REF_KIND=tag
        IMAGE_TAG="$(printf '%s' "$RAW_IMAGE_TAG" \
          | sed 's/[^A-Za-z0-9_.-]/-/g' \
          | sed 's/^[.-]*//' \
          | sed 's/[.-]*$//' \
          | cut -c1-128)"
      else
        REF_KIND=commit
        IMAGE_TAG="$(printf '%s' "$GITMAN_COMMIT" | cut -c1-12)"
      fi

      if [ -z "$IMAGE_TAG" ]; then
        echo "Resolved image tag is empty" >&2
        exit 1
      fi

      cat > .gitman-image.env <<EOF
      REF_KIND=$REF_KIND
      RAW_IMAGE_TAG=$RAW_IMAGE_TAG
      IMAGE_TAG=$IMAGE_TAG
      IMAGE_REF=$IMAGE_NAME:$IMAGE_TAG
      EOF

      cat .gitman-image.env

  - name: build image
    run: |
      set -eu
      . ./.gitman-image.env

      docker build \
        --pull=false \
        --build-arg GO_IMAGE="$GO_IMAGE" \
        --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
        --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
        --build-arg DEBIAN_SECURITY_MIRROR="$DEBIAN_SECURITY_MIRROR" \
        --build-arg GOPROXY="$GOPROXY" \
        --build-arg VERSION="$IMAGE_TAG" \
        --build-arg COMMIT="$GITMAN_COMMIT" \
        --label "org.opencontainers.image.title=sms-gateway" \
        --label "org.opencontainers.image.revision=$GITMAN_COMMIT" \
        --label "org.opencontainers.image.ref.name=$IMAGE_TAG" \
        --label "org.opencontainers.image.version=$IMAGE_TAG" \
        --tag "$IMAGE_REF" \
        -f deploy/Dockerfile \
        .

  - name: verify built image
    run: |
      set -eu
      . ./.gitman-image.env

      docker image inspect "$IMAGE_REF" >/dev/null

      docker run --rm "$IMAGE_REF" gateway version

      GOT_REVISION="$(docker image inspect \
        -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
        "$IMAGE_REF")"
      test "$GOT_REVISION" = "$GITMAN_COMMIT"

      echo "image:   $IMAGE_REF"
      echo "kind:    $REF_KIND"
      echo "commit:  $GITMAN_COMMIT"

  - name: deploy
    run: |
      set -eu
      . ./.gitman-image.env

      if [ "$REF_KIND" != tag ]; then
        echo "Not a tagged ref, skipping deploy"
        exit 0
      fi

      : "${DEPLOY_DIR:?DEPLOY_DIR is required}"

      if [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "Missing $DEPLOY_DIR/.env" >&2
        exit 1
      fi

      cp deploy/docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"

      if grep -q '^APP_IMAGE=' "$DEPLOY_DIR/.env"; then
        sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$IMAGE_REF#" "$DEPLOY_DIR/.env"
      else
        printf 'APP_IMAGE=%s\n' "$IMAGE_REF" >> "$DEPLOY_DIR/.env"
      fi

      docker compose \
        --project-directory "$DEPLOY_DIR" \
        --env-file "$DEPLOY_DIR/.env" \
        -f "$DEPLOY_DIR/docker-compose.yml" \
        up -d --remove-orphans
