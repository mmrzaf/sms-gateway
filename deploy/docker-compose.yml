name: sms-gateway

x-gateway: &gateway
  image: sms-gateway:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "gateway"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *gateway
    command: ["gateway", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  gateway-api:
    <<: *gateway
    command: ["gateway", "serve", "--role=api"]
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "gateway", "probe", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway-worker:
    <<: *gateway
    command: ["gateway", "serve", "--role=worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "gateway", "probe", "http://localhost:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
